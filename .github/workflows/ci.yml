name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Verify wheel install and primary journey
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install --force-reinstall --no-deps "$wheel"
          python -m pip check
          samsarix-codegen --version
          samsarix-codegen build "Explain this function" --task explain --file examples/sample.py > prompt.md
          grep -q "def greet" prompt.md
          samsarix-codegen build "Review the context loader" --task review --context-manifest examples/review-context-v1.json --format json > manifest-request.json
          grep -q '"name": "src/samsarix_codegen/context.py"' manifest-request.json
          samsarix-codegen schema context-manifest > context-manifest.schema.json
          python -c "import json; from jsonschema import Draft202012Validator; schema=json.load(open('context-manifest.schema.json', encoding='utf-8')); payload=json.load(open('examples/review-context-v1.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(payload)"
          printf 'diff --git a/app.py b/app.py\n+enabled = True\n' |
            samsarix-codegen build "Review this change" --task review --stdin-name staged.diff --format json > request.json
          fingerprint="$(samsarix-codegen inspect request.json --format fingerprint)"
          test "${fingerprint#sha256:}" != "$fingerprint"
          test "${#fingerprint}" -eq 71
          samsarix-codegen inspect request.json --format markdown > reviewed-prompt.md
          grep -q "Review this change" reviewed-prompt.md
          printf 'diff --git a/app.py b/app.py\n+enabled = False\n' |
            samsarix-codegen build "Review the revised change" --task review --stdin-name staged.diff --format json > revised-request.json
          samsarix-codegen compare request.json revised-request.json --format json > comparison.json
          grep -q '"changed": true' comparison.json
          samsarix-codegen schema request > request.schema.json
          python -c "import json; from jsonschema import Draft202012Validator; schema=json.load(open('request.schema.json', encoding='utf-8')); payload=json.load(open('request.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(payload)"
          samsarix-codegen schema provider-check > provider-check.schema.json
          python -c "from pathlib import Path; from samsarix_codegen import ProviderCheckReport, render_provider_check; Path('provider-check.json').write_text(render_provider_check(ProviderCheckReport(model='fixture-model', max_output_tokens=64, response_chars=11), output_format='json'), encoding='utf-8')"
          python -c "import json; from jsonschema import Draft202012Validator; schema=json.load(open('provider-check.schema.json', encoding='utf-8')); payload=json.load(open('provider-check.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(payload)"
          python -c "import json; from pathlib import Path; from samsarix_codegen import ExecutionResult; fingerprint=json.load(open('request.json', encoding='utf-8'))['request_fingerprint']; Path('result-a.json').write_text(json.dumps(ExecutionResult(fingerprint, 'model-a', 'first response', 10, 2, 12).to_payload()), encoding='utf-8'); Path('result-b.json').write_text(json.dumps(ExecutionResult(fingerprint, 'model-b', 'second response', 10, 3, 13).to_payload()), encoding='utf-8')"
          samsarix-codegen inspect-result result-a.json --format json > result-inspection.json
          ! grep -q "first response" result-inspection.json
          samsarix-codegen schema result-inspection > result-inspection.schema.json
          python -c "import json; from jsonschema import Draft202012Validator; schema=json.load(open('result-inspection.schema.json', encoding='utf-8')); payload=json.load(open('result-inspection.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(payload)"
          samsarix-codegen compare-results result-a.json result-b.json --format json > result-comparison.json
          ! grep -q "first response\|second response" result-comparison.json
          samsarix-codegen schema result-comparison > result-comparison.schema.json
          python -c "import json; from jsonschema import Draft202012Validator; schema=json.load(open('result-comparison.schema.json', encoding='utf-8')); payload=json.load(open('result-comparison.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(payload)"
