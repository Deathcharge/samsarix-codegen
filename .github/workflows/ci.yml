name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type-check
        run: python -m mypy src
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Verify wheel install and primary journey
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install --force-reinstall --no-deps "$wheel"
          helix-codegen --version
          helix-codegen build "Explain this function" --task explain --file examples/sample.py > prompt.md
          grep -q "def greet" prompt.md
