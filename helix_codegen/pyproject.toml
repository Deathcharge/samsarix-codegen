[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-codegen"
version = "1.0.0"
description = "AI-powered code generation for Helix CLI"
authors = [{name = "Helix Collective"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=10.0",
    "requests>=2.28",
    "pydantic>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
